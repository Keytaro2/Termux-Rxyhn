# MPD for Termux (feeds the "Music" widget and the rice's media keys)
#
# 1) Give it access to your files:   termux-setup-storage
#    (creates ~/storage/music -> /sdcard/Music). Change the path below if your
#    music is somewhere else.
# 2) Start PulseAudio (autostart does it) and then mpd.
# 3) Update the db:                mpc update
music_directory    "~/storage/music"
playlist_directory "~/.config/mpd/playlists"
db_file            "~/.config/mpd/database"
state_file         "~/.config/mpd/state"
log_file           "~/.config/mpd/log"
pid_file           "~/.config/mpd/pid"
bind_to_address    "127.0.0.1"
auto_update        "yes"
port               "6600"

audio_output {
    type        "pulse"
    name        "PulseAudio"
}

# ncmpcpp visualizer (music.sh adjusts the fifo path to $PREFIX/tmp)
audio_output {
    type   "fifo"
    name   "Visualizer"
    format "44100:16:2"
    path   "~/../usr/tmp/mpd.fifo"
}
